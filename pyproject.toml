[project]
name = "reservation-orchestrator"
version = "0.1.0"
description = "Reservation & Booking Orchestrator — hold → pay → confirm → cancel with human-gated refunds"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "apscheduler>=3.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "refund_gate: refund gate policy tests (Principle VI, 100% line+branch)",
    "contract: OpenAPI contract tests",
    "integration: cross-module integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.report]
fail_under = 70
show_missing = true
